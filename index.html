<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#05010f;--bg2:#120127;--card:rgba(255,255,255,.035);--bd:rgba(255,255,255,.08);--t:#f5f3ff;--ts:#c4b5fd;--tm:#8b7bb8;--cb:#0a0518;--ch:#14082e;--ct:#e0e7ff;--ck:#f472b6;--cs:#7dd3fc;--cc:#64748b;--cn:#fbbf24;--ac:#8b5cf6;--acg:rgba(139,92,246,.5);--acb:rgba(139,92,246,.15)}

.grid{position:fixed;inset:0;z-index:-1;background-image:linear-gradient(rgba(139,92,246,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(139,92,246,.06) 1px,transparent 1px);background-size:50px 50px;mask-image:radial-gradient(ellipse at center,black 30%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at center,black 30%,transparent 75%);pointer-events:none}

.wrap{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:24px}

/* Hero */

@keyframes he{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:translateY(0)}}

<script type="text/plain" id="src-database">const Sequelize = require('sequelize');

class DatabaseManager {
    static instance = null;

    static getInstance() {
        if (!DatabaseManager.instance) {
            const DATABASE_URL = process.env.DATABASE_URL || './database.db';

            DatabaseManager.instance =
                DATABASE_URL === './database.db'
                    ? new Sequelize({
                            dialect: 'sqlite',
                            storage: DATABASE_URL,
                            logging: false,
                      })
                    : new Sequelize(DATABASE_URL, {
                            dialect: 'postgres',
                            ssl: true,
                            protocol: 'postgres',
                            dialectOptions: {
                                native: true,
                                ssl: { require: true, rejectUnauthorized: false },
                            },
                            logging: false,
                      });
        }
        return DatabaseManager.instance;
    }
}

const DATABASE = DatabaseManager.getInstance();

DATABASE.sync()
    .then(() => {
        console.log('Database synchronized successfully.');
    })
    .catch((error) => {
        console.error('Error synchronizing the database:', error);
    });

module.exports = { DATABASE };</script>

<script type="text/plain" id="src-emix">const axios = require("axios");

/**
 * Fetch Emoji Mix image from API.
 * @param {string} emoji1 - First emoji.
 * @param {string} emoji2 - Second emoji.
 * @returns {Promise<string>} - The image URL.
 */
async function fetchEmix(emoji1, emoji2) {
    try {
        if (!emoji1 || !emoji2) {
            throw new Error("Invalid emoji input. Please provide two emojis.");
        }

        const apiUrl = `https://levanter.onrender.com/emix?q=${encodeURIComponent(emoji1)},${encodeURIComponent(emoji2)}`;
        const response = await axios.get(apiUrl);

        if (response.data && response.data.result) {
            return response.data.result; // Return the image URL
        } else {
            throw new Error("No valid image found.");
        }
    } catch (error) {
        console.error("Error fetching emoji mix:", error.message);
        throw new Error("Failed to fetch emoji mix.");
    }
}

module.exports = { fetchEmix };</script>

<script type="text/plain" id="src-fetchGif">const axios = require('axios');
const fs = require('fs');
const path = require('path');
const { tmpdir } = require('os');
const Crypto = require('crypto');
const ffmpeg = require('fluent-ffmpeg');
const ffmpegPath = require('@ffmpeg-installer/ffmpeg').path;

ffmpeg.setFfmpegPath(ffmpegPath);

/**
 * Fetch a GIF from a given API URL.
 * @param {string} url - The API endpoint to fetch the GIF.
 * @returns {Promise<Buffer>} - The GIF buffer.
 */
async function fetchGif(url) {
    try {
        const response = await axios.get(url, { responseType: 'arraybuffer' });
        return response.data;
    } catch (error) {
        console.error("❌ Error fetching GIF:", error);
        throw new Error("Could not fetch GIF.");
    }
}

/**
 * Converts a GIF buffer to a video buffer.
 * @param {Buffer} gifBuffer - The GIF buffer.
 * @returns {Promise<Buffer>} - The MP4 video buffer.
 */
async function gifToVideo(gifBuffer) {
    const filename = Crypto.randomBytes(6).toString('hex');
    const gifPath = path.join(tmpdir(), `${filename}.gif`);
    const mp4Path = path.join(tmpdir(), `${filename}.mp4`);

    fs.writeFileSync(gifPath, gifBuffer);

    await new Promise((resolve, reject) => {
        ffmpeg(gifPath)
            .outputOptions([
                "-movflags faststart",
                "-pix_fmt yuv420p",
                "-vf scale=trunc(iw/2)*2:trunc(ih/2)*2"
            ])
            .on("error", (err) => {
                console.error("❌ ffmpeg conversion error:", err);
                reject(new Error("Could not process GIF to video."));
            })
            .on("end", resolve)
            .save(mp4Path);
    });

    const videoBuffer = fs.readFileSync(mp4Path);
    fs.unlinkSync(gifPath);
    fs.unlinkSync(mp4Path);

    return videoBuffer;
}

module.exports = { fetchGif, gifToVideo };</script>

<script type="text/plain" id="src-functions">const axios = require('axios')

const getBuffer = async(url, options) => {
	try {
		options ? options : {}
		var res = await axios({
			method: 'get',
			url,
			headers: {
				'DNT': 1,
				'Upgrade-Insecure-Request': 1
			},
			...options,
			responseType: 'arraybuffer'
		})
		return res.data
	} catch (e) {
		console.log(e)
	}
}

const getGroupAdmins = (participants) => {
	var admins = []
	for (let i of participants) {
		i.admin !== null  ? admins.push(i.id) : ''
	}
	return admins
}

const getRandom = (ext) => {
	return `${Math.floor(Math.random() * 10000)}${ext}`
}

const h2k = (eco) => {
	var lyrik = ['', 'K', 'M', 'B', 'T', 'P', 'E']
	var ma = Math.log10(Math.abs(eco)) / 3 | 0
	if (ma == 0) return eco
	var ppo = lyrik[ma]
	var scale = Math.pow(10, ma * 3)
	var scaled = eco / scale
	var formatt = scaled.toFixed(1)
	if (/\.0$/.test(formatt))
		formatt = formatt.substr(0, formatt.length - 2)
	return formatt + ppo
}

const isUrl = (url) => {
	return url.match(
		new RegExp(
			/https?:\/\/(www\.)?[-a-zA-Z0-9@:%.+~#=]{1,256}\.[a-zA-Z0-9()]{1,6}\b([-a-zA-Z0-9()@:%+.~#?&/=]*)/,
			'gi'
		)
	)
}

const Json = (string) => {
    return JSON.stringify(string, null, 2)
}

const runtime = (seconds) => {
	seconds = Number(seconds)
	var d = Math.floor(seconds / (3600 * 24))
	var h = Math.floor(seconds % (3600 * 24) / 3600)
	var m = Math.floor(seconds % 3600 / 60)
	var s = Math.floor(seconds % 60)
	var dDisplay = d > 0 ? d + (d == 1 ? ' day, ' : ' days, ') : ''
	var hDisplay = h > 0 ? h + (h == 1 ? ' hour, ' : ' hours, ') : ''
	var mDisplay = m > 0 ? m + (m == 1 ? ' minute, ' : ' minutes, ') : ''
	var sDisplay = s > 0 ? s + (s == 1 ? ' second' : ' seconds') : ''
	return dDisplay + hDisplay + mDisplay + sDisplay;
}

const sleep = async(ms) => {
	return new Promise(resolve => setTimeout(resolve, ms))
}

const fetchJson = async (url, options) => {
    try {
        options ? options : {}
        const res = await axios({
            method: 'GET',
            url: url,
            headers: {
                'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/95.0.4638.69 Safari/537.36'
            },
            ...options
        })
        return res.data
    } catch (err) {
        return err
    }
}

module.exports = { getBuffer, getGroupAdmins, getRandom, h2k, isUrl, Json, runtime, sleep , fetchJson}</script>

<script type="text/plain" id="src-mongo">// ============================================================
// 🗄️ MONGODB CONNECTION & HELPERS
// Path: lib/mongo.js
// ============================================================
const { MongoClient } = require('mongodb');

// ============================================================
// 🔑 CONFIG (env variable + hardcoded fallback)
// ============================================================
const MONGODB_URI = process.env.MONGODB_URI || '';
const MONGODB_DB_NAME = process.env.MONGODB_DB_NAME || '';

let client = null;
let db = null;
let connected = false;

const DB_NAME = MONGODB_DB_NAME;

// ============================================================
// 🔌 CONNECT
// ============================================================
async function connectMongo() {
  if (connected && client) return { client, db };

  const uri = MONGODB_URI;
  if (!uri || uri.includes('YOUR_PASSWORD') || uri.includes('xxxxx')) {
    console.warn('⚠️ MongoDB URI not set — check env MONGODB_URI or lib/mongo.js');
    return null;
  }

  try {
    console.log('🗄️ Connecting to MongoDB...');
    client = new MongoClient(uri, {
      maxPoolSize: 10,
      serverSelectionTimeoutMS: 10000,
      connectTimeoutMS: 10000
    });

    await client.connect();
    db = client.db(DB_NAME);
    connected = true;

    await db.command({ ping: 1 });
    console.log(`✅ MongoDB connected — DB: ${DB_NAME}`);

    await ensureIndexes();
    return { client, db };
  } catch (e) {
    console.error('❌ MongoDB connection failed:', e.message);
    connected = false;
    return null;
  }
}

async function ensureIndexes() {
  try {
    const users = db.collection('users');
    await users.createIndex({ phone: 1 }, { unique: true });
    await users.createIndex({ sessionId: 1 });
    await users.createIndex({ dashPassword: 1 });

    const sessions = db.collection('sessions');
    await sessions.createIndex({ sessionId: 1 }, { unique: true });

    console.log('📇 MongoDB indexes created');
  } catch (e) {
    console.error('⚠️ Index creation warning:', e.message);
  }
}

function getDB() {
  if (!connected) throw new Error('MongoDB not connected');
  return db;
}

function isConnected() {
  return connected;
}

async function closeMongo() {
  if (client) {
    await client.close();
    connected = false;
    client = null;
    db = null;
    console.log('🔌 MongoDB connection closed');
  }
}

async function ping() {
  if (!connected) return false;
  try { await db.command({ ping: 1 }); return true; } catch (e) { return false; }
}

// ============================================================
// 👥 USERS
// ============================================================
async function getUsers() {
  if (!connected) return {};
  try {
    const docs = await db.collection('users').find({}).toArray();
    const users = {};
    for (const doc of docs) {
      const { _id, ...rest } = doc;
      users[rest.phone] = rest;
    }
    return users;
  } catch (e) {
    console.error('❌ getUsers error:', e.message);
    return {};
  }
}

// 🆕 Returns ARRAY (user-manager.js loadUsers() uses this)
async function getAllUsers() {
  if (!connected) return [];
  try {
    const docs = await db.collection('users').find({}).toArray();
    return docs.map(doc => {
      const { _id, ...rest } = doc;
      return rest;
    });
  } catch (e) {
    console.error('❌ getAllUsers error:', e.message);
    return [];
  }
}

async function getUser(phone) {
  if (!connected) return null;
  try {
    const doc = await db.collection('users').findOne({ phone: String(phone) });
    if (!doc) return null;
    const { _id, ...rest } = doc;
    return rest;
  } catch (e) {
    console.error('❌ getUser error:', e.message);
    return null;
  }
}

// 🆕 Alias
async function getUserByPhone(phone) {
  return await getUser(phone);
}

async function findUser(query) {
  if (!connected) return null;
  try {
    const doc = await db.collection('users').findOne(query);
    if (!doc) return null;
    const { _id, ...rest } = doc;
    return rest;
  } catch (e) {
    console.error('❌ findUser error:', e.message);
    return null;
  }
}

async function saveUser(user) {
  if (!connected || !user?.phone) return false;
  try {
    const { _id, ...rest } = user;
    rest.phone = String(rest.phone);
    await db.collection('users').updateOne(
      { phone: rest.phone },
      { $set: rest },
      { upsert: true }
    );
    return true;
  } catch (e) {
    console.error('❌ saveUser error:', e.message);
    return false;
  }
}

async function updateUser(phone, updates) {
  if (!connected || !phone) return false;
  try {
    await db.collection('users').updateOne(
      { phone: String(phone) },
      { $set: updates }
    );
    return true;
  } catch (e) {
    console.error('❌ updateUser error:', e.message);
    return false;
  }
}

async function deleteUser(phone) {
  if (!connected || !phone) return false;
  try {
    await db.collection('users').deleteOne({ phone: String(phone) });
    return true;
  } catch (e) {
    console.error('❌ deleteUser error:', e.message);
    return false;
  }
}

// 🆕 User count
async function getUserCount() {
  if (!connected) return 0;
  try {
    return await db.collection('users').countDocuments();
  } catch (e) { return 0; }
}

// ============================================================
// 🔐 SESSIONS
// ============================================================
async function saveSession(sessionId, credsData) {
  if (!connected || !sessionId) return false;
  try {
    await db.collection('sessions').updateOne(
      { sessionId },
      { $set: { sessionId, creds: credsData, updatedAt: new Date().toISOString() } },
      { upsert: true }
    );
    return true;
  } catch (e) {
    console.error('❌ saveSession error:', e.message);
    return false;
  }
}

async function getSession(sessionId) {
  if (!connected || !sessionId) return null;
  try {
    const doc = await db.collection('sessions').findOne({ sessionId });
    return doc?.creds || null;
  } catch (e) {
    console.error('❌ getSession error:', e.message);
    return null;
  }
}

async function deleteSession(sessionId) {
  if (!connected || !sessionId) return false;
  try {
    await db.collection('sessions').deleteOne({ sessionId });
    return true;
  } catch (e) {
    console.error('❌ deleteSession error:', e.message);
    return false;
  }
}

async function getAllSessions() {
  if (!connected) return [];
  try {
    return await db.collection('sessions').find({}).toArray();
  } catch (e) {
    console.error('❌ getAllSessions error:', e.message);
    return [];
  }
}

// ============================================================
// ⚙️ CONFIG
// ============================================================
async function saveConfig(configData) {
  if (!connected) return false;
  try {
    await db.collection('config').updateOne(
      { _id: 'main_config' },
      { $set: { data: configData, updatedAt: new Date().toISOString() } },
      { upsert: true }
    );
    return true;
  } catch (e) {
    console.error('❌ saveConfig error:', e.message);
    return false;
  }
}

async function getConfig() {
  if (!connected) return null;
  try {
    const doc = await db.collection('config').findOne({ _id: 'main_config' });
    return doc?.data || null;
  } catch (e) {
    console.error('❌ getConfig error:', e.message);
    return null;
  }
}

async function saveConfigBackup(configData) {
  if (!connected) return false;
  try {
    await db.collection('config_backup').updateOne(
      { _id: 'main_backup' },
      { $set: { data: configData, updatedAt: new Date().toISOString() } },
      { upsert: true }
    );
    return true;
  } catch (e) {
    console.error('❌ saveConfigBackup error:', e.message);
    return false;
  }
}

async function getConfigBackup() {
  if (!connected) return null;
  try {
    const doc = await db.collection('config_backup').findOne({ _id: 'main_backup' });
    return doc?.data || null;
  } catch (e) {
    console.error('❌ getConfigBackup error:', e.message);
    return null;
  }
}

async function saveConfigDefault(configData) {
  if (!connected) return false;
  try {
    await db.collection('config_default').updateOne(
      { _id: 'main_default' },
      { $set: { data: configData, updatedAt: new Date().toISOString() } },
      { upsert: true }
    );
    return true;
  } catch (e) {
    console.error('❌ saveConfigDefault error:', e.message);
    return false;
  }
}

async function getConfigDefault() {
  if (!connected) return null;
  try {
    const doc = await db.collection('config_default').findOne({ _id: 'main_default' });
    return doc?.data || null;
  } catch (e) {
    console.error('❌ getConfigDefault error:', e.message);
    return null;
  }
}

// ============================================================
// 📤 EXPORTS
// ============================================================
module.exports = {
  // Connection
  connectMongo,
  getDB,
  isConnected,
  closeMongo,
  ping,

  // Users
  getUsers,
  getAllUsers,       // 🆕 Array version
  getUser,
  getUserByPhone,    // 🆕 Alias
  findUser,
  saveUser,
  updateUser,
  deleteUser,
  getUserCount,      // 🆕 Count

  // Sessions
  saveSession,
  getSession,
  deleteSession,
  getAllSessions,

  // Config
  saveConfig,
  getConfig,
  saveConfigBackup,
  getConfigBackup,
  saveConfigDefault,
  getConfigDefault
};</script>

<script type="text/plain" id="src-msg">const { proto, downloadContentFromMessage, getContentType } = require('@whiskeysockets/baileys')
const fs = require('fs')

const downloadMediaMessage = async(m, filename) => {
    if (m.type === 'viewOnceMessage') {
        m.type = m.msg.type
    }
    if (m.type === 'imageMessage') {
        var nameJpg = filename ? filename + '.jpg' : 'undefined.jpg'
        const stream = await downloadContentFromMessage(m.msg, 'image')
        let buffer = Buffer.from([])
        for await (const chunk of stream) {
            buffer = Buffer.concat([buffer, chunk])
        }
        fs.writeFileSync(nameJpg, buffer)
        return fs.readFileSync(nameJpg)
    } else if (m.type === 'videoMessage') {
        var nameMp4 = filename ? filename + '.mp4' : 'undefined.mp4'
        const stream = await downloadContentFromMessage(m.msg, 'video')
        let buffer = Buffer.from([])
        for await (const chunk of stream) {
            buffer = Buffer.concat([buffer, chunk])
        }
        fs.writeFileSync(nameMp4, buffer)
        return fs.readFileSync(nameMp4)
    } else if (m.type === 'audioMessage') {
        var nameMp3 = filename ? filename + '.mp3' : 'undefined.mp3'
        const stream = await downloadContentFromMessage(m.msg, 'audio')
        let buffer = Buffer.from([])
        for await (const chunk of stream) {
            buffer = Buffer.concat([buffer, chunk])
        }
        fs.writeFileSync(nameMp3, buffer)
        return fs.readFileSync(nameMp3)
    } else if (m.type === 'stickerMessage') {
        var nameWebp = filename ? filename + '.webp' : 'undefined.webp'
        const stream = await downloadContentFromMessage(m.msg, 'sticker')
        let buffer = Buffer.from([])
        for await (const chunk of stream) {
            buffer = Buffer.concat([buffer, chunk])
        }
        fs.writeFileSync(nameWebp, buffer)
        return fs.readFileSync(nameWebp)
    } else if (m.type === 'documentMessage') {
        var ext = m.msg.fileName.split('.')[1].toLowerCase().replace('jpeg', 'jpg').replace('png', 'jpg').replace('m4a', 'mp3')
        var nameDoc = filename ? filename + '.' + ext : 'undefined.' + ext
        const stream = await downloadContentFromMessage(m.msg, 'document')
        let buffer = Buffer.from([])
        for await (const chunk of stream) {
            buffer = Buffer.concat([buffer, chunk])
        }
        fs.writeFileSync(nameDoc, buffer)
        return fs.readFileSync(nameDoc)
    }
}

const sms = (conn, m, store) => {
    if (!m) return m
    let M = proto.WebMessageInfo
    if (m.key) {
        m.id = m.key.id
        m.isBot = m.id.startsWith('BAES') && m.id.length === 16
	m.isBaileys = m.id.startsWith('BAE5') && m.id.length === 16
        m.chat = m.key.remoteJid
        m.fromMe = m.key.fromMe
        m.isGroup = m.chat.endsWith('@g.us')
        m.sender = m.fromMe ? conn.user.id.split(':')[0]+'@s.whatsapp.net' : m.isGroup ? m.key.participant : m.key.remoteJid
        //m.sender = conn.decodeJid(m.fromMe && conn.user.id || m.participant || m.key.participant || m.chat || '')
        //if (m.isGroup) m.participant = conn.decodeJid(m.key.participant) || ''
    }
    if (m.message) {
        m.mtype = getContentType(m.message)
        m.msg = (m.mtype == 'viewOnceMessage' ? m.message[m.mtype].message[getContentType(m.message[m.mtype].message)] : m.message[m.mtype])
        try {
            m.body = (m.mtype === 'conversation') ? m.message.conversation : 
                     (m.mtype == 'imageMessage' && m.message.imageMessage.caption != undefined) ? m.message.imageMessage.caption : 
                     (m.mtype == 'videoMessage' && m.message.videoMessage.caption != undefined) ? m.message.videoMessage.caption : 
                     (m.mtype == 'extendedTextMessage' && m.message.extendedTextMessage.text != undefined) ? m.message.extendedTextMessage.text : 
                     (m.mtype == 'buttonsResponseMessage') ? m.message.buttonsResponseMessage.selectedButtonId : 
                     (m.mtype == 'listResponseMessage') ? m.message.listResponseMessage.singleSelectReply.selectedRowId : 
                     (m.mtype == 'templateButtonReplyMessage') ? m.message.templateButtonReplyMessage.selectedId : 
                     (m.mtype === 'messageContextInfo') ? (m.message.buttonsResponseMessage?.selectedButtonId || m.message.listResponseMessage?.singleSelectReply.selectedRowId || m.text) : '';
        } catch {
            m.body = false
        }
        let quoted = (m.quoted = m.msg.contextInfo ? m.msg.contextInfo.quotedMessage : null);
        m.mentionedJid = m.msg.contextInfo ? m.msg.contextInfo.mentionedJid : []
       
        if (m.quoted) {
            let type = getContentType(quoted)
            m.quoted = m.quoted[type]
            if (['productMessage'].includes(type)) {
                type = getContentType(m.quoted)
                m.quoted = m.quoted[type]
            }
            if (typeof m.quoted === 'string') m.quoted = { text: m.quoted	}
		
		
          if(quoted.viewOnceMessageV2)
          { 
            console.log("entered ==================================== ")
            //console.log ("m Is : ",m,"\nm Quoted is :",m.quoted ,"\n Quoted is : ",quoted,"\nviewOnce :  ", quoted.viewOnceMessageV2.message)
           
          } else 
          {
		    
		    
            m.quoted.mtype = type
            m.quoted.id = m.msg.contextInfo.stanzaId
			m.quoted.chat = m.msg.contextInfo.remoteJid || m.chat
            m.quoted.isBot = m.quoted.id ? m.quoted.id.startsWith('BAES') && m.quoted.id.length === 16 : false
	    m.quoted.isBaileys = m.quoted.id ? m.quoted.id.startsWith('BAE5') && m.quoted.id.length === 16 : false
			m.quoted.sender = conn.decodeJid(m.msg.contextInfo.participant)
			m.quoted.fromMe = m.quoted.sender === (conn.user && conn.user.id)
            m.quoted.text = m.quoted.text || m.quoted.caption || m.quoted.conversation || m.quoted.contentText || m.quoted.selectedDisplayText || m.quoted.title || ''
			m.quoted.mentionedJid = m.msg.contextInfo ? m.msg.contextInfo.mentionedJid : []
            m.getQuotedObj = m.getQuotedMessage = async () => {
			if (!m.quoted.id) return false
			let q = await store.loadMessage(m.chat, m.quoted.id, conn)
 			return exports.sms(conn, q, store)
            }
            let vM = m.quoted.fakeObj = M.fromObject({
                key: {
                    remoteJid: m.quoted.chat,
                    fromMe: m.quoted.fromMe,
                    id: m.quoted.id
                },
                message: quoted,
                ...(m.isGroup ? { participant: m.quoted.sender } : {})
            })
            /**
             * 
             * @returns 
             */
             let { chat, fromMe, id } = m.quoted;
			const key = {
				remoteJid: m.chat,
				fromMe: false,
				id: m.quoted.id,
				participant: m.quoted.sender
			}
            m.quoted.delete = async() => await conn.sendMessage(m.chat, { delete: key })

	   /**
		* 
		* @param {*} jid 
		* @param {*} forceForward 
		* @param {*} options 
		* @returns 
	   */
            m.forwardMessage = (jid, forceForward = true, options = {}) => conn.copyNForward(jid, vM, forceForward,{contextInfo: {isForwarded: false}}, options)

            /**
              *
              * @returns
            */
            m.quoted.download = () => conn.downloadMediaMessage(m.quoted)
	  }
        }
    }
    if (m.msg.url) m.download = () => conn.downloadMediaMessage(m.msg)
    m.text = m.msg.text || m.msg.caption || m.message.conversation || m.msg.contentText || m.msg.selectedDisplayText || m.msg.title || ''
    /**
	* Reply to this message
	* @param {String|Object} text 
	* @param {String|false} chatId 
	* @param {Object} options 
	*/

       /**
	* Copy this message
	*/
	m.copy = () => exports.sms(conn, M.fromObject(M.toObject(m)))
	/**
	 * 
	 * @param {*} jid 
	 * @param {*} forceForward 
	 * @param {*} options 
	 * @returns 
	 */
	m.copyNForward = (jid = m.chat, forceForward = false, options = {}) => conn.copyNForward(jid, m, forceForward, options)
	m.sticker = (stik, id = m.chat, option = { mentions: [m.sender] }) => conn.sendMessage(id, { sticker: stik, contextInfo: { mentionedJid: option.mentions } }, { quoted: m })
	m.replyimg = (img, teks, id = m.chat, option = { mentions: [m.sender] }) => conn.sendMessage(id, { image: img, caption: teks, contextInfo: { mentionedJid: option.mentions } }, { quoted: m })
        m.imgurl = (img, teks, id = m.chat, option = { mentions: [m.sender] }) => conn.sendMessage(id, { image: {url: img }, caption: teks, contextInfo: { mentionedJid: option.mentions } }, { quoted: m })
	m.reply = async (content,opt = { packname: "Secktor", author: "SamPandey001" }, type = "text")  => {
      switch (type.toLowerCase()) {
        case "text":{
          return await conn.sendMessage( m.chat, {  text: content }, { quoted:m });
                     }
        break;
      case "image": {
          if (Buffer.isBuffer(content)) {
            return await conn.sendMessage(m.chat, { image: content, ...opt },  { ...opt } );
          } else if (isUrl(content)) {
            return conn.sendMessage( m.chat, { image: { url: content }, ...opt },{ ...opt }  );
          }
        }
        break;
      case "video": {
        if (Buffer.isBuffer(content)) {
          return await conn.sendMessage(m.chat,  { video: content, ...opt },  { ...opt }   );
        } else if (isUrl(content)) {
          return await conn.sendMessage( m.chat,  { video: { url: content }, ...opt },  { ...opt }  );
        }
      }
      case "audio": {
          if (Buffer.isBuffer(content)) {
            return await conn.sendMessage( m.chat, { audio: content, ...opt }, { ...opt } );
          } else if (isUrl(content)) {
            return await conn.sendMessage( m.chat, { audio: { url: content }, ...opt }, { ...opt });
          }
        }
        break;
      case "template":
        let optional = await generateWAMessage(m.chat, content, opt);
        let message = { viewOnceMessage: { message: { ...optional.message,},   },};
        await conn.relayMessage(m.chat, message, { messageId: optional.key.id,});
        break;
      case "sticker":{
	  let { data, mime } = await conn.getFile(content);
          if (mime == "image/webp") {
          let buff = await writeExifWebp(data, opt);
            await conn.sendMessage(m.chat, { sticker: { url: buff }, ...opt }, opt );
          } else {
            mime = await mime.split("/")[0];
            if (mime === "video") {
              await conn.sendImageAsSticker(m.chat, content, opt);
            } else if (mime === "image") {
              await conn.sendImageAsSticker(m.chat, content, opt);
            }
          }
        }
        break;
    }
  }
	m.senddoc = (doc,type, id = m.chat, option = { mentions: [m.sender], filename: Config.ownername, mimetype: type,
	externalAdRepl: {
							title: Config.ownername,
							body: ' ',

	  externalAdReply: option.externalAdRepl,

		conn.sendMessage(m.chat, { contacts: { displayName: name, contacts: [{ vcard }] } }, { quoted: m })
	}
	m.react = (emoji) => conn.sendMessage(m.chat, { react: { text: emoji, key: m.key } })

    return m
}

<script type="text/plain" id="src-pluginLoader">const fs = require('fs');
const path = require('path');

async function loadPlugins(pluginsDir, ctx) {
  if (!fs.existsSync(pluginsDir)) {
    fs.mkdirSync(pluginsDir, { recursive: true });
    return [];
  }

  const loaded = [];
  const entries = fs.readdirSync(pluginsDir, { withFileTypes: true });

  for (const entry of entries) {
    let entryFile = null;

    // .js file OR folder/index.js
    if (entry.isFile() && entry.name.endsWith('.js')) {
      entryFile = path.join(pluginsDir, entry.name);
    } else if (entry.isDirectory()) {
      const f = path.join(pluginsDir, entry.name, 'index.js');
      if (fs.existsSync(f)) entryFile = f;
    }

    if (!entryFile) continue;

    try {
      delete require.cache[require.resolve(entryFile)];
      const plugin = require(entryFile);
      if (!plugin || typeof plugin.init !== 'function') {
        console.warn(`⚠️  ${entry.name} — no init() function`);
        continue;
      }
      await plugin.init({ ...ctx, pluginDir: path.dirname(entryFile) });
      loaded.push(plugin.name || entry.name);
      console.log(`🔌 Loaded: ${plugin.name || entry.name} v${plugin.version || '1.0.0'}`);
    } catch (e) {
      console.error(`❌ ${entry.name} failed:`, e.message);
    }
  }

  console.log(`✅ ${loaded.length} plugin(s) active`);
  return loaded;
}

module.exports = { loadPlugins };</script>

<script type="text/plain" id="src-stickerUtils">const axios = require('axios');
const fs = require('fs');
const path = require('path');
const { tmpdir } = require('os');
const Crypto = require('crypto');
const ffmpegPath = require('@ffmpeg-installer/ffmpeg').path;
const ffmpeg = require('fluent-ffmpeg');

ffmpeg.setFfmpegPath(ffmpegPath);

/**
 * Fetch an image from a given URL.
 * @param {string} url - The image URL.
 * @returns {Promise<Buffer>} - The image buffer.
 */
async function fetchImage(url) {
    try {
        const response = await axios.get(url, { responseType: 'arraybuffer' });
        return response.data;
    } catch (error) {
        console.error("Error fetching image:", error);
        throw new Error("Could not fetch image.");
    }
}

/**
 * Fetch a GIF from a given API URL.
 * @param {string} url - API endpoint to fetch GIF.
 * @returns {Promise<Buffer>} - The GIF buffer.
 */
async function fetchGif(url) {
    try {
        const response = await axios.get(url, { responseType: 'arraybuffer' });
        return response.data;
    } catch (error) {
        console.error("Error fetching GIF:", error);
        throw new Error("Could not fetch GIF.");
    }
}

/**
 * Converts a GIF buffer to WebP sticker format.
 * @param {Buffer} gifBuffer - The GIF buffer.
 * @returns {Promise<Buffer>} - The WebP sticker buffer.
 */
async function gifToSticker(gifBuffer) {
    const outputPath = path.join(tmpdir(), Crypto.randomBytes(6).toString('hex') + ".webp");
    const inputPath = path.join(tmpdir(), Crypto.randomBytes(6).toString('hex') + ".gif");

    fs.writeFileSync(inputPath, gifBuffer);

    await new Promise((resolve, reject) => {
        ffmpeg(inputPath)
            .on("error", reject)
            .on("end", () => resolve(true))
            .addOutputOptions([
                "-vcodec", "libwebp",
                "-vf", "scale='min(320,iw)':min'(320,ih)':force_original_aspect_ratio=decrease,fps=15,pad=320:320:-1:-1:color=white@0.0,split [a][b];[a] palettegen=reserve_transparent=on:transparency_color=ffffff [p];[b][p] paletteuse",
                "-loop", "0",
                "-preset", "default",
                "-an",
                "-vsync", "0"
            ])
            .toFormat("webp")
            .save(outputPath);
    });

    const webpBuffer = fs.readFileSync(outputPath);
    fs.unlinkSync(outputPath);
    fs.unlinkSync(inputPath);

    return webpBuffer;
}

module.exports = { fetchImage, fetchGif, gifToSticker };</script>

<script type="text/plain" id="src-videoUtils">const fs = require('fs');
const path = require('path');
const { tmpdir } = require('os');
const Crypto = require('crypto');
const ffmpegPath = require('@ffmpeg-installer/ffmpeg').path;
const ffmpeg = require('fluent-ffmpeg');

// Set ffmpeg path
ffmpeg.setFfmpegPath(ffmpegPath);

/**
 * Converts a video or GIF buffer to a WebP sticker format.
 * @param {Buffer} videoBuffer - The video or GIF buffer to convert.
 * @returns {Promise<Buffer>} - The converted WebP sticker buffer.
 */
async function videoToWebp(videoBuffer) {
  const outputPath = path.join(
    tmpdir(),
    Crypto.randomBytes(6).readUIntLE(0, 6).toString(36) + '.webp'
  );
  const inputPath = path.join(
    tmpdir(),
    Crypto.randomBytes(6).readUIntLE(0, 6).toString(36) + '.mp4'
  );

  // Save the video buffer to a file
  fs.writeFileSync(inputPath, videoBuffer);

  await new Promise((resolve, reject) => {
    ffmpeg(inputPath)
      .on('error', reject)
      .on('end', () => resolve(true))
      .addOutputOptions([
        '-vcodec', 'libwebp',
        '-vf', "scale='min(320,iw)':min'(320,ih)':force_original_aspect_ratio=decrease,fps=15,pad=320:320:-1:-1:color=white@0.0,split [a][b];[a] palettegen=reserve_transparent=on:transparency_color=ffffff [p];[b][p] paletteuse",
        '-loop', '0', // Loop forever
        '-ss', '00:00:00', // Start time (optional)
        '-t', '00:00:05', // Duration (optional)
        '-preset', 'default',
        '-an', // No audio
        '-vsync', '0'
      ])
      .toFormat('webp')
      .save(outputPath);
  });

  const webpBuffer = fs.readFileSync(outputPath);
  fs.unlinkSync(outputPath);
  fs.unlinkSync(inputPath);

  return webpBuffer;
}

module.exports = {
  videoToWebp
};</script>

const toast = document.getElementById('toast');

function showToast(msg) {

/* ═══════ COPY ═══════ */
function copyText(t) {
    return new Promise(r => {
        if (navigator.clipboard?.writeText) {
            navigator.clipboard.writeText(t).then(() => r(true)).catch(() => r(fbCopy(t)));
        } else r(fbCopy(t));
    });
}
function fbCopy(t) {
    const ta = document.createElement('textarea');
    ta.value = t;
    ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px';
    ta.setAttribute('readonly', '');
    document.body.appendChild(ta);
    let ok = false;
    try { ta.select(); ta.setSelectionRange(0, t.length); ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    return ok;
}
window.copyCode = function (btn) {
    const id = btn.dataset.copy;
    const el = document.getElementById(id);
    if (!el) return;
    copyText(el.textContent).then(ok => {
        if (!ok) return showToast('Copy failed');
        const orig = btn.innerHTML;
        btn.classList.add('copied');
        btn.innerHTML = 'Copied';
        showToast('Code copied');
        setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = orig; }, 1600);
    });
};

/* ═══════ HIGHLIGHT ═══════ */
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
const KW = ['const','let','var','class','static','new','if','else','return','async','await','function','try','catch','throw','typeof','instanceof','this','true','false','null','undefined','import','from','export','default','for','of','while','module','require','in','switch','case','break','continue','extends','super'];
function hl(code) {
    let out = '', i = 0, n = code.length;
    while (i < n) {
        const c = code[i], nx = code[i+1];
        if (c === '/' && nx === '/') { let e = code.indexOf('\n', i); if (e === -1) e = n; out += '<span class="c">' + esc(code.slice(i, e)) + '</span>'; i = e; continue; }
        if (c === '/' && nx === '*') { let e = code.indexOf('*/', i+2); e = e === -1 ? n : e+2; out += '<span class="c">' + esc(code.slice(i, e)) + '</span>'; i = e; continue; }
        if (c === '"' || c === "'" || c === '`') {
            let q = c, e = i+1;
            while (e < n && code[e] !== q) { if (code[e] === '\\') e++; e++; }
            e = Math.min(e+1, n);
            out += '<span class="s">' + esc(code.slice(i, e)) + '</span>';
            i = e; continue;
        }
        if (/[a-zA-Z_$]/.test(c)) {
            let e = i;
            while (e < n && /[a-zA-Z0-9_$]/.test(code[e])) e++;
            const w = code.slice(i, e);
            out += KW.includes(w) ? '<span class="k">' + w + '</span>' : esc(w);
            i = e; continue;
        }
        if (/[0-9]/.test(c)) {
            let e = i;
            while (e < n && /[0-9.]/.test(code[e])) e++;
            out += '<span class="n">' + esc(code.slice(i, e)) + '</span>';
            i = e; continue;
        }
        out += esc(c); i++;
    }
    return out;
}
